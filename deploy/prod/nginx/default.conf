upstream gunicorn {
    server                      unix:/app/run/gunicorn.sock fail_timeout=0;
}

server {
    listen                      80;
    server_name                 _;
    return                      301 https://$host$request_uri;
}

server {
    listen                      443 ssl http2;
    server_name                 _;

    # Самоподписанный сертификат
    ssl_certificate             /etc/nginx/certs/localhost.crt;
    ssl_certificate_key         /etc/nginx/certs/localhost.key;

    # (Не обязательно, но полезно) современные настройки TLS
    ssl_protocols               TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers   off;

    client_max_body_size        640m;

    # Статика/медиа (volume)
    location /static/ {
        alias                   /vol/static/;
        expires                 30d;
        add_header              Cache-Control "public";
    }

    location /protected/ {
        internal;
        alias                   /app/contest/contest/;
        expires                 30d;
        add_header              Cache-Control "public";
    }

    # Проксирование на gunicorn (Django)
    location / {
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;

        proxy_pass              http://web:8000;
        proxy_read_timeout      120;
    }

    location = /favicon.ico {
        log_not_found           off;
        access_log              off;
    }

    location = /robots.txt {
        log_not_found           off;
        access_log              off;
    }
}
