{% for breadcrumb in breadcrumbs %}
<li class="breadcrumb-item {% if not breadcrumb.url %}active{% endif %}" {% if not breadcrumb.url %}aria-current="page"{% endif %}>
    {% if breadcrumb.url %}
    <a href="{{ breadcrumb.url }}">{{ breadcrumb.title }}</a>
    {% else %}
    {{ breadcrumb.title }}
    {% endif %}
</li>
{% endfor %}
